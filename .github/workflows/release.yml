name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v). Builds an artifact only; tag pushes publish a release.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, notarize
    runs-on: macos-26
    # The Developer ID key and the notarization key only exist in this
    # environment. Restricting the trigger to tags is not a control by itself:
    # anyone who can push a v* tag can also push the scripts it points at. Give
    # the environment a required reviewer and limit it to v* tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CFBundleVersion is the commit count

      # The input arrives via the environment, not `${{ }}` interpolation, so a
      # crafted version string can't run as code in a job holding signing secrets.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::'$version' is not a valid version such as 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: sh test.sh

      # The certificate goes in a throwaway keychain: the runner's login keychain
      # isn't on codesign's search list, and this one dies with the runner.
      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          certificate="$RUNNER_TEMP/certificate.p12"

          if [[ -z "$CERTIFICATE_P12" || -z "$CERTIFICATE_PASSWORD" ]]; then
            echo "::error::MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD must both be set in the release environment"
            exit 1
          fi
          if ! printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"; then
            echo "::error::MACOS_CERTIFICATE_P12 is not valid base64"
            exit 1
          fi
          if openssl pkcs12 -in "$certificate" -passin env:CERTIFICATE_PASSWORD -noout 2>/dev/null; then
            :
          elif openssl pkcs12 -legacy -in "$certificate" -passin env:CERTIFICATE_PASSWORD -noout 2>/dev/null; then
            echo "::error::MACOS_CERTIFICATE_P12 uses legacy RC2 encryption, which the runner cannot reliably import. Re-export it with modern encryption."
            exit 1
          else
            echo "::error::MACOS_CERTIFICATE_P12 is not a valid PKCS#12 file, or MACOS_CERTIFICATE_PASSWORD is wrong"
            exit 1
          fi

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -f pkcs12 -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign blocks on a GUI prompt nobody can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$certificate"

          security find-identity -v -p codesigning "$keychain"

      - name: Build, sign, notarize, package
        env:
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          NOTARY_API_KEY_P8: ${{ secrets.NOTARY_API_KEY_P8 }}
          REQUIRE_NOTARIZATION: '1'
          VERSION: ${{ steps.version.outputs.version }}
        run: ./Scripts/release.sh "$VERSION"

      - name: Discard the signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: ResourcesBar-${{ steps.version.outputs.version }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 \
              --title "ResourcesBar ${GITHUB_REF_NAME#v}" \
              --generate-notes \
              --verify-tag
          fi
